name: Model Validation

on:
  push:
    branches:
      - main

jobs:
  run-model:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: |
          pip install -r requirements.txt

      - name: Run regression script
        run: |
          python your_script.py
